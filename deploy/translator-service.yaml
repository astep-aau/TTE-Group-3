apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: translator-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /translator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-service
  labels:
    app: translator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator-service
  template:
    metadata:
      labels:
        app: translator-service
    spec:
      containers:
        - name: translator-service
          image: your-image:tag  # Add your actual image here
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "50m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: translator-service
  labels:
    app: translator-service
spec:
  type: ClusterIP
  selector:
    app: translator-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: translator-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.middlewares: default-translator-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cs-25-sw-5-03.cs-astep02.srv.aau.dk
      http:
        paths:
          - path: /translator
            pathType: Prefix
            backend:
              service:
                name: translator-service
                port:
                  number: 80
