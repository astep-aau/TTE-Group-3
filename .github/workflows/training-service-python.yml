name: training-service-python

on:
  push:
    branches: [ dev ]
    paths:
      - 'training-service/Python/**'
      - 'deploy/training-service-python.yaml'
      - '.github/workflows/training-service-python.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: astep-aau/training-service-python
  K8S_NAMESPACE: cs-25-sw-5-03

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.tags.outputs.sha }}
      image_latest: ${{ steps.tags.outputs.latest }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r training-service/Python/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 training-service/Python --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 training-service/Python --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Compute image tags
        id: tags
        run: |
          echo "sha=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: training-service/Python/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.latest }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      K8S_NAMESPACE: cs-25-sw-5-03
      IMAGE: ${{ needs.build-and-push.outputs.image_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check permissions
        run: |
          kubectl auth whoami
          kubectl auth can-i update deployments -n "$K8S_NAMESPACE"

      - name: Apply deployment manifests
        run: |
          kubectl apply -f deploy/training-service-python.yaml -n "$K8S_NAMESPACE"

      - name: Update image only if changed
        run: |
          set -euo pipefail
          CUR="$(kubectl -n "$K8S_NAMESPACE" get deploy/training-service-python -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "$CUR" == "$IMAGE" ]]; then
            echo "Image already applied ($IMAGE). Skipping rollout."
            exit 0
          fi
          kubectl -n "$K8S_NAMESPACE" set image deployment/training-service-python training-service-python="$IMAGE"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/training-service-python --timeout=10m

